<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foresight Tray Lab</title>
<link rel="stylesheet" href="../../static/fonts/foresight-fonts.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2c1a10;font-family:var(--fs-font-body)}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;touch-action:none}
  /* demo contents (a real page brings its own) */
  .pad{padding:16px 18px;font-size:13px;line-height:1.5}
  .bubble{background:rgba(255,255,255,.10);border-radius:14px;padding:8px 12px;margin:0 0 10px;max-width:80%}
  .bubble.me{margin-left:auto;background:rgba(214,169,87,.20)}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px;height:100%;box-sizing:border-box}
  .tile{border-radius:12px;background:linear-gradient(160deg,#6a4426,#1a0f08)}
  .tile:nth-child(2){background:linear-gradient(160deg,#2a3f63,#0b1020)} .tile:nth-child(3){background:linear-gradient(160deg,#5a3517,#120904)}
  .tile:nth-child(4){background:linear-gradient(160deg,#efe6d2,#b7a27c)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px}
  .tool{height:58px;border-radius:12px;background:rgba(255,255,255,.07);display:grid;place-items:center;font-size:11px}
  .row{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12.5px}
  .row b{color:#9fd59a;font-weight:600}
  .mixer{display:flex;gap:6px;height:100%;padding:10px 12px;box-sizing:border-box}
  .strip{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;font-size:10px;color:#e8d8b8}
  .strip .meter{width:6px;flex:0 0 34px;border-radius:3px;background:#120c08;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(214,169,87,.3)}
  .strip .meter i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#5fbf6a,#d9c45a 70%,#d9603f)}
  .strip .fader{flex:1;width:100%;position:relative;min-height:60px}
  .strip .fader input{position:absolute;left:50%;top:50%;width:70px;transform:translate(-50%,-50%) rotate(-90deg);accent-color:#d6a957}
  .strip .mute{width:24px;height:18px;border:0;border-radius:5px;background:#3a2c20;color:#e8d8b8;font:700 10px var(--fs-font-display);cursor:pointer}
  .strip .mute.on{background:#c0503a;color:#fff}
  .keys{position:absolute;inset:12px 14px;display:flex}
  .keys .wk{flex:1;margin:0 1px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#f5ecd9,#d9ccb0);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);cursor:pointer}
  .keys .bk{position:absolute;top:0;width:4.6%;height:58%;border-radius:0 0 4px 4px;background:linear-gradient(180deg,#2a2018,#0b0806);box-shadow:0 2px 3px rgba(0,0,0,.6);cursor:pointer;z-index:1}
  .keys .down{background:linear-gradient(180deg,#e9b860,#b9822a) !important}
  .filev{position:absolute;inset:0;display:grid;place-items:center} .filev img,.filev video{max-width:100%;max-height:100%;display:block}
  .filev pre{position:absolute;inset:0;margin:0;padding:12px 14px;overflow:auto;font:12px/1.45 ui-monospace,monospace;white-space:pre-wrap}
  /* the system bar: live text over the bar the renderer draws */
  .bar-ui{position:fixed;left:84px;top:13px;z-index:2;display:flex;gap:4px;align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-family:var(--fs-font-display)}
  .bar-ui .brand{font-weight:700;letter-spacing:.26em;font-size:17px;margin-right:24px;color:#3a2a14;text-shadow:0 1px 0 rgba(255,246,222,.75),0 -1px 0 rgba(60,40,15,.25)}
  .bar-ui button{background:none;border:0;padding:6px 10px;border-radius:8px;font:inherit;color:#2e2418;font-weight:700;cursor:pointer}
  .bar-ui button:hover{background:rgba(60,40,20,.10)} .bar-ui button.on{background:rgba(60,40,20,.16)}
  #barArt{position:fixed;left:0;top:0;z-index:1;pointer-events:none}
  @media (max-width:760px){ .bar-ui .brand{font-size:13px;margin-right:8px} .bar-ui button{padding:6px 6px;font-size:10px} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<svg id="barArt" aria-hidden="true"></svg>
<div class="bar-ui"><span class="brand">FORESIGHT</span>
  <button data-theme="tigereye" class="on">Tiger's eye</button><button data-theme="pearl">Pearl marble</button><button data-theme="indigo">Indigo stone</button><button data-theme="nero">Nero</button>
  <button id="openBtn" title="Open something in a new tray">Open&hellip;</button><button id="lockAllBtn">Lock all</button>
</div>
<script src="../../static/foresight_shapes.js"></script>
<script src="../../static/foresight_gl.js"></script>
<script src="../../static/foresight_chain.js"></script>
<script src="../../static/foresight_counter.js"></script>
<script>
'use strict';
/* The tray lab: the Foresight Counter with demonstration contents. Everything about trays (moving, denting,
   squeezing, locking, the fan, the menus) comes from foresight_counter.js; this page only supplies contents, a
   starting layout and the renderer's settings. */
const M = ForesightGL.MAT, params = new URLSearchParams(location.search);
const canvas = document.getElementById('gl');
const G = new ForesightGL(canvas);
G.loadStone('../../static/foresight_stone_tigereye.jpg');
const theme = params.get('theme') || 'tigereye';

// ---- demonstration contents. Each declares its title, natural size, the minimum at which it stays usable and the
// general shape it reads best in. A real page supplies its programs the same way.
const CONTENT = {
  'video.preview': {title:'Live Preview', family:'heptagon', w:600, h:338, minW:320, minH:180, minScale:0.5, bg:'#000',
    build: (root, st, c) => { c.bgHTML = '<video src="sample.webm" autoplay muted loop playsinline></video>'; }},
  'chat.main': {title:'Conversation', family:'hexagon', w:290, h:360, minW:240, minH:220, bg:'radial-gradient(120% 90% at 20% 0%,#4a2a6e,#1c1030 70%)',
    html:'<div class="pad"><div class="bubble">Ready when you are.</div><div class="bubble me">Lay the trays out on the bench.</div><div class="bubble">Done. They make room for each other.</div></div>'},
  'files.browser': {title:'Project Files', family:'trapezoid', w:540, h:190, minW:360, minH:150, bg:'linear-gradient(170deg,#1d3456,#0a1426)',
    html:'<div class="tiles"><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div></div>'},
  'output.view': {title:'Work Output', family:'pentagon', w:290, h:280, minW:230, minH:190, bg:'linear-gradient(160deg,#f7efdd,#e3d2ae)', ink:'dark',
    html:'<div class="pad"><b>Social post</b><br>1080 &times; 1350 &middot; PNG<br><br>A warm, inviting post for the evening crowd.</div>'},
  'tools.palette': {title:'Tools', family:'rhombus', w:240, h:210, minW:220, minH:170, bg:'radial-gradient(110% 90% at 30% 10%,#1f5a43,#0a2219 75%)',
    html:'<div class="grid"><div class="tool">Image</div><div class="tool">Design</div><div class="tool">Copy</div><div class="tool">Resize</div><div class="tool">Grade</div><div class="tool">Mock</div></div>'},
  'status.monitor': {title:'System Status', family:'octagon', w:290, h:150, minW:240, minH:120, bg:'radial-gradient(120% 100% at 20% 0%,#6a1c24,#2a0a0e 75%)',
    html:'<div class="pad"><div class="row"><span>AI agent</span><b>Active</b></div><div class="row"><span>Engine</span><b>Active</b></div><div class="row"><span>Backup</span><span>2 min ago</span></div></div>'},
  'audio.mixer': {title:'Audio Mixer', family:'trapezoid', w:560, h:190, minW:470, minH:170, bg:'linear-gradient(170deg,#2a2018,#0d0907)', build: buildMixer},
  'input.keyboard': {title:'Keyboard', family:'trapezoid', w:560, h:170, minW:480, minH:140, bg:'linear-gradient(170deg,#1c1612,#090605)', build: buildKeyboard},
  'page': {title:'Page', family:'octagon', w:760, h:470, minW:420, minH:280, bg:'#120d09', build: buildPage},
  'file.image': {title:'Image', family:'hexagon', w:480, h:340, minW:200, minH:150, minScale:0.5, bg:'#0d0a08', build: buildFile},
  'file.video': {title:'Video', family:'heptagon', w:560, h:316, minW:280, minH:160, minScale:0.5, bg:'#000', build: buildFile},
  'file.text': {title:'Text', family:'pentagon', w:460, h:360, minW:260, minH:200, bg:'linear-gradient(160deg,#f7efdd,#e3d2ae)', ink:'dark', build: buildFile},
  'file.pdf': {title:'Document', family:'octagon', w:560, h:420, minW:320, minH:260, bg:'#2a2622', build: buildFile},
};
const PAGES = [['Control Room','/static/control_room.html'], ['Director Switcher','/static/director_switcher.html'], ['Gallery','/static/gallery.html'], ['Teleprompter','/static/pubcast_teleprompter.html']];
// A mixer: channel strips with a level meter, a fader and a mute. Its state lives in the content.
function buildMixer(root, state){
  const names = ['Mic 1','Mic 2','Guest','Music','FX','Room','Bus A','Main'];
  state.levels = state.levels || names.map((_, i) => 0.55 + 0.04*i);
  state.mute = state.mute || names.map(() => false);
  root.innerHTML = '<div class="mixer">' + names.map((n, i) =>
    '<div class="strip" data-i="' + i + '"><div class="meter"><i style="height:' + Math.round(state.levels[i]*100) + '%"></i></div>' +
    '<div class="fader"><input type="range" min="0" max="100" value="' + Math.round(state.levels[i]*100) + '" aria-label="' + n + ' level"></div>' +
    '<button class="mute' + (state.mute[i] ? ' on' : '') + '" aria-label="Mute ' + n + '">M</button><span>' + n + '</span></div>').join('') + '</div>';
  root.querySelectorAll('.strip').forEach(st => {
    const i = +st.dataset.i, r = st.querySelector('input'), m = st.querySelector('.mute'), bar = st.querySelector('.meter i');
    r.addEventListener('input', () => { state.levels[i] = r.value/100; bar.style.height = r.value + '%'; });
    m.addEventListener('click', () => { state.mute[i] = !state.mute[i]; m.classList.toggle('on', state.mute[i]); });
  });
}
// A keyboard: two octaves; pressed keys light up.
function buildKeyboard(root, state){
  const whites = 14, blackAfter = [0,1,3,4,5,7,8,10,11,12];
  let h = '<div class="keys">';
  for(let i = 0; i < whites; i++) h += '<div class="wk" data-k="w' + i + '"></div>';
  for(const i of blackAfter) h += '<div class="bk" data-k="b' + i + '" style="left:calc(' + ((i + 1)/whites*100) + '% - 3.2%)"></div>';
  root.innerHTML = h + '</div>';
  state.pressed = state.pressed || {};
  root.querySelectorAll('[data-k]').forEach(k => {
    if(state.pressed[k.dataset.k]) k.classList.add('down');
    k.addEventListener('pointerdown', () => { state.pressed[k.dataset.k] = !state.pressed[k.dataset.k]; k.classList.toggle('down', state.pressed[k.dataset.k]); });
  });
}
// A page of the program, live in an iframe.
function buildPage(root, state, c){
  const f = document.createElement('iframe'); f.src = c.data && c.data.url || 'about:blank'; f.setAttribute('loading', 'lazy');
  f.setAttribute('allow', 'microphone; camera; autoplay; clipboard-read; clipboard-write'); root.appendChild(f);
}
// A file from this computer. Browsers do not keep access to a picked file across a reload, so a reloaded tray says so.
function buildFile(root, state, c){
  const d = c.data || {}, v = document.createElement('div'); v.className = 'filev'; root.appendChild(v);
  if(!d.url){ v.innerHTML = '<div class="pad" style="opacity:.75"></div>'; v.firstChild.textContent = (d.name || 'This file') + ' needs to be opened again (browsers do not keep a picked file after a reload).'; return; }
  if(c.type === 'file.image'){ const i = new Image(); i.src = d.url; i.alt = d.name || ''; v.appendChild(i); }
  else if(c.type === 'file.video'){ const x = document.createElement('video'); x.src = d.url; x.controls = true; x.playsInline = true; v.appendChild(x); }
  else if(c.type === 'file.pdf'){ const f = document.createElement('iframe'); f.src = d.url; f.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0'; v.appendChild(f); }
  else { const pre = document.createElement('pre'); pre.textContent = 'Loading…'; v.appendChild(pre); fetch(d.url).then(r => r.text()).then(t => { pre.textContent = t.slice(0, 200000); }).catch(() => { pre.textContent = 'Could not read this file.'; }); }
}
const provider = {
  catalog(){
    return [
      {type:'video.preview', title:'Live Preview', group:'Studio'}, {type:'audio.mixer', title:'Audio Mixer', group:'Studio'}, {type:'input.keyboard', title:'Keyboard', group:'Studio'},
      {type:'chat.main', title:'Conversation', group:'Work'}, {type:'files.browser', title:'Project Files', group:'Work'}, {type:'output.view', title:'Work Output', group:'Work'},
      {type:'tools.palette', title:'Tools', group:'Work'}, {type:'status.monitor', title:'System Status', group:'Work'},
      ...PAGES.map(([title, url]) => ({type:'page', title, group:'Rooms (live pages)', hint: url, data:{url, title}})),
    ];
  },
  describe(type, data){
    const d = CONTENT[type]; if(!d) return null;
    const out = Object.assign({}, d);
    if(data && data.title) out.title = data.title; else if(data && data.name) out.title = data.name;
    return out;
  },
  mount(c, host){
    const d = CONTENT[c.type]; if(!d) throw new Error('Unknown content: ' + c.type);
    if(d.build) d.build(host.body, c.state, c); else host.body.innerHTML = d.html || '';
    if(c.bgHTML){ host.bg.innerHTML = c.bgHTML; delete c.bgHTML; }
  },
  serialize(c){ return c.state; },
  fromFile(file){
    const url = URL.createObjectURL(file), name = file.name, t = file.type || '';
    if(t.startsWith('image/')) return {type:'file.image', data:{url, name}};
    if(t.startsWith('video/') || t.startsWith('audio/')) return {type:'file.video', data:{url, name}};
    if(t === 'application/pdf') return {type:'file.pdf', data:{url, name}};
    if(t.startsWith('text/') || /\.(md|txt|json|csv|log|py|js|html|css)$/i.test(name)) return {type:'file.text', data:{url, name}};
    return null;
  },
};

// ---- the frames' looks on each counter: [rim material, glow, frame design 0..8]
// designs: 0 deco chevrons, 1 gadroon, 2 flutes, 3 rope, 4 sunburst, 5 egg and dart, 6 stepped, 7 guilloche, 8 meander
const LOOKS = {
  tigereye:{preview:[M.GOLD,'amber',4], chat:[M.BRONZE,'violet',7], files:[M.STEEL,'blue',8], output:[M.NACRE,'warm',5], tools:[M.SILVER,'green',6], status:[M.OPAL,'red',2]},
  pearl:{preview:[M.SILVER,'pearl',0], chat:[M.CHAMPAGNE,'pearl',7], files:[M.STEEL,'pearl',8], output:[M.ROSE_GOLD,'warm',5], tools:[M.NACRE,'pearl',1], status:[M.GOLD,'green',4]},
  nero:{preview:[M.ROSE_GOLD,'ruby',8], chat:[M.COPPER,'teal',1], files:[M.CHAMPAGNE,'sapphire',5], output:[M.BRASS,'citrine',6], tools:[M.GOLD,'emerald',0], status:[M.NACRE,'amethyst',3]},
};
LOOKS.indigo = LOOKS.tigereye; LOOKS.walnut = LOOKS.tigereye;
// ---- starting layouts (used when nothing was saved, or with ?fresh=1)
const C = (...types) => types.map(type => ({type}));
const SPECS_A = [
  {id:'preview', contents:C('video.preview'), x:640, y:300},
  {id:'chat', contents:C('chat.main'), x:200, y:600},
  {id:'files', contents:C('audio.mixer','input.keyboard','files.browser'), x:690, y:735},
  {id:'output', contents:C('output.view'), x:1240, y:360},
  {id:'tools', contents:C('tools.palette'), x:1240, y:760},
  {id:'status', contents:C('status.monitor'), x:1230, y:120},
];
const SPECS_B = [
  {id:'preview', contents:C('video.preview'), x:800, y:360, family:'octagon', w:640, h:360},
  {id:'chat', contents:C('chat.main'), x:1350, y:560, family:'ellipse', w:270, h:360},
  {id:'files', contents:C('files.browser'), x:250, y:620, family:'hexagon', w:360, h:240},
  {id:'output', contents:C('audio.mixer','input.keyboard','output.view'), x:800, y:830},
  {id:'tools', contents:C('tools.palette'), x:250, y:885, family:'pentagon', w:250, h:170},
  {id:'status', contents:C('status.monitor'), x:1340, y:170, family:'heptagon', w:280, h:150},
];

// ---- the renderer's settings (all optional, from the address)
G.aged = parseFloat(params.get('aged') || '0'); G.saturation = parseFloat(params.get('sat') || '1'); G.contrast = parseFloat(params.get('contrast') || '1');
if(params.get('lamp')){ G.lamp = true; const v = parseFloat(params.get('lamp')); G.lampHeight = v > 0.05 && v < 2 ? v : 0.30; }
if(params.get('fill')) G.setLight({az:135, el:48, kelvin:4300, intensity:parseFloat(params.get('intensity') || '1'), fill:parseFloat(params.get('fill'))});
if(params.get('exp')) G.exposure = parseFloat(params.get('exp')); else if(G.lamp){ G.exposure = 1.9; G.bloomMix = 0.032; }
if(params.get('l2')) G.setLight2({intensity: parseFloat(params.get('l2')) || 0, az: parseFloat(params.get('l2az') || '-35'), el: parseFloat(params.get('l2el') || '24')});
G.paint = Math.min(1, Math.max(0, parseFloat(params.get('paint') || '0') || 0));
G.ramp = Math.min(1, Math.max(0, parseFloat(params.get('ramp') || '0') || 0)); G.rampSteps = parseFloat(params.get('steps') || '6') || 6;
G.wear = Math.min(1, Math.max(0, parseFloat(params.get('wear') || '0') || 0));
if(params.get('edges') === 'chain') ForesightChain.OPT.edges = 'chain';   // the many-link chain frames, for comparison

let currentTheme = theme;
const counter = ForesightCounter.create({canvas, gl: G, provider, theme, top: 70,
  storageKey: params.has('nosave') ? null : 'foresight.lab.v2',
  looks: (t, th) => (LOOKS[th] && LOOKS[th][t.id]) || null});
const saved = params.has('fresh') ? null : (() => { try{ return JSON.parse(localStorage.getItem('foresight.lab.v2') || 'null'); }catch(e){ return null; } })();
if(!(saved && counter.restore(saved))) counter.layout(theme === 'nero' ? SPECS_B : SPECS_A);
if(params.get('select')) counter.select(counter.find(params.get('select')));

document.querySelectorAll('.bar-ui [data-theme]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
function setTheme(name){ currentTheme = name; counter.setTheme(name); document.querySelectorAll('.bar-ui [data-theme]').forEach(b => b.classList.toggle('on', b.dataset.theme === name)); }
setTheme(theme);
document.getElementById('openBtn').addEventListener('click', () => counter.openPicker(null));
const lockBtn = document.getElementById('lockAllBtn');
lockBtn.addEventListener('click', () => { counter.lockAll(); lockBtn.textContent = counter.trays.every(t => t.hidden || t.locked) ? 'Unlock all' : 'Lock all'; });

// ---- the system bar's Art Deco dressing: a gilt fan at the centre, stepped inlay lines out to each end, rhombus studs
function drawBarArt(){
  const W = innerWidth, svg = document.getElementById('barArt');
  svg.setAttribute('width', W); svg.setAttribute('height', 70); svg.setAttribute('viewBox', '0 0 ' + W + ' 70');
  if(W < 1000){ svg.innerHTML = ''; return; }
  const cx = W/2, gold = 'url(#gg)';
  let o = '<defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0c0"/><stop offset=".45" stop-color="#c9973f"/><stop offset="1" stop-color="#6e4a16"/></linearGradient></defs>';
  const ox = cx, oy = 56, R1 = 15, R2 = 38;
  for(let i = 0; i <= 10; i++){ const a = Math.PI*(1.08 + 0.84*i/10), c = Math.cos(a), sn = Math.sin(a);
    o += '<line x1="'+(ox+c*R1)+'" y1="'+(oy+sn*R1)+'" x2="'+(ox+c*R2)+'" y2="'+(oy+sn*R2)+'" stroke="'+gold+'" stroke-width="'+(i%2 ? 2.0 : 3.4)+'" stroke-linecap="round"/>'; }
  o += '<path d="M'+(ox-R2-2)+' '+(oy-3)+' A'+(R2+2)+' '+(R2+2)+' 0 0 1 '+(ox+R2+2)+' '+(oy-3)+'" fill="none" stroke="'+gold+'" stroke-width="3" stroke-linecap="round"/>';
  o += '<path d="M'+(ox-R1)+' '+(oy-1)+' A'+R1+' '+R1+' 0 0 1 '+(ox+R1)+' '+(oy-1)+'" fill="none" stroke="'+gold+'" stroke-width="2" stroke-linecap="round"/>';
  for(const side of [-1, 1]){
    const x0 = cx + side*62, x1 = side < 0 ? 760 : W - 36;
    if(side < 0 && x1 > x0 - 40) continue;
    const pts = [[x0, 25], [cx + side*(62 + Math.abs(x1-x0)*0.55), 25], [cx + side*(62 + Math.abs(x1-x0)*0.55 + 10), 32], [x1, 32]];
    o += '<polyline points="'+pts.map(p => p.join(',')).join(' ')+'" fill="none" stroke="'+gold+'" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    const sx = pts[2][0], sy = 32;
    o += '<path d="M'+sx+' '+(sy-8)+' L'+(sx+8)+' '+sy+' L'+sx+' '+(sy+8)+' L'+(sx-8)+' '+sy+'Z" fill="'+gold+'" stroke="#5a3a10" stroke-width=".6"/>';
    const ex = x1 - side*8; o += '<path d="M'+ex+' 28 L'+(ex+4)+' 32 L'+ex+' 36 L'+(ex-4)+' 32Z" fill="'+gold+'"/>';
  }
  svg.innerHTML = o;
}
drawBarArt(); addEventListener('resize', drawBarArt);

// ---- hooks for screenshots and tests
window.__counter = counter;
window.__settle = () => counter.settle(300);
window.__draw = () => counter.debug.draw();
if(!params.has('once')){ counter.settle(200); counter.start(); }
</script>
</body>
</html>
