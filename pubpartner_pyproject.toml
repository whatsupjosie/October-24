[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pubpartner"
version = "0.3.0"
description = "Persistent character cartridges for consistent AI personas across sessions."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "tiktoken>=0.5",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
chat = ["anthropic>=0.30"]

[project.scripts]
pubpartner = "pubpartner.cli:main"

[tool.setuptools.packages.find]
include = ["pubpartner*", "companion_support*"]
