name: Bella Faux Pas real browser capture
on:
  push:
    branches: [codex/makehuman-demo-walker-2026-10-30]
    paths:
      - 'tools/capture_bella_live.py'
      - '.github/workflows/bella-live-capture.yml'
      - 'static/world_walk*'
      - 'static/world/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture actual room image, animated Husky, and doorway traversal
        run: python tools/capture_bella_live.py
      - name: Upload real browser captures and diagnostics (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bella-real-browser-capture
          path: artifacts/bella_live/
          if-no-files-found: warn
