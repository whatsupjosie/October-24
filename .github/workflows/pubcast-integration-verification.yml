name: PubCast isolated integration verification
on:
  push:
    branches:
      - pubcast/integration-ci-2026-10-24
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Python compilation
        run: python -m compileall -q main.py modules pubpartner
      - name: Foresight, 2i, and PubPartner integration tests
        run: |
          python -m pytest -q \
            tests/test_foresight_8787_wiring.py \
            tests/test_foresight_cohesive_program.py \
            tests/test_foresight_front_door.py \
            tests/test_pubpartner_shared_auth_authority.py \
            tests/test_reach_writers_room.py \
            --junitxml=pubcast-integration-junit.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubcast-integration-evidence
          path: |
            pubcast-integration-junit.xml
          if-no-files-found: ignore
