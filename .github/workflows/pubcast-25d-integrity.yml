name: PubCast 2.5D Integrity
on:
  push:
    branches:
      - pubcast-25d-production-integration-2026-10-30
  workflow_dispatch:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse studio and switcher scripts
        run: |
          node --check static/production25d_core.js
          node --check static/production25d_renderer.js
          node --check static/production25d_storage.js
          node --check static/production25d_switcher_bridge.js
          node --check static/production25d_frame_publisher.js
          node --check static/studio25d_remote_feed.js
          node --check static/production25d_app.js
          node --check static/control_stations.js
          node --check static/control_switcher.js
          node --check static/program_audio_runtime.js
      - name: Run dependency-free studio tests
        run: |
          node --test tests/test_production25d_core.cjs tests/test_production25d_wiring.cjs tests/test_production25d_switcher_bridge.cjs tests/test_studio25d_confidence.cjs
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check modified production modules and test sources
        run: |
          python -m py_compile modules/studio25d_media_routes.py modules/switcher_routes.py modules/program_audio.py modules/program_audio_routes.py modules/production_routes.py main.py tests/test_studio25d_media_routes.py tests/test_shared_studio_switchers.py
