name: PubCast integration smoke
on:
  push:
    branches: [integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify working-tree migration
        run: |
          test -f main.py || { echo "BLOCKED: integrated main.py has not been migrated"; exit 1; }
          test -d tests || { echo "BLOCKED: integration tests have not been migrated"; exit 1; }
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile application
        run: python -m compileall -q main.py modules
      - name: Integration regressions
        run: |
          python -m pytest -q tests/test_foresight_8787_wiring.py tests/test_foresight_cohesive_program.py tests/test_foresight_front_door.py tests/test_reach_writers_room.py --junitxml=pubcast-smoke.xml
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubcast-smoke-results
          path: pubcast-smoke.xml
          if-no-files-found: ignore
