const gltf=await new GLTFLoader().parseAsync(bytes.buffer,'');
const model=gltf.scene; scene.add(model);

const box=new THREE.Box3().setFromObject(model), size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
model.position.sub(center); model.position.y += size.y/2;
const scale=1.75/Math.max(size.y,1e-6); model.scale.setScalar(scale);
model.updateMatrixWorld(true);

const names=["Pelvis","Spine_01","UpperArm_L","UpperArm_R","Thigh_L","Thigh_R","Calf_L","Calf_R"];
const bones={}; model.traverse(o=>{if(o.isBone && names.includes(o.name)) bones[o.name]=o;});
const base={}; for(const [n,b] of Object.entries(bones)) base[n]=b.quaternion.clone();
const axisX=new THREE.Vector3(1,0,0), axisY=new THREE.Vector3(0,1,0), axisZ=new THREE.Vector3(0,0,1);
function addRot(boneName,axis,angle){
 const b=bones[boneName]; if(!b)return;
 b.quaternion.copy(base[boneName]).multiply(new THREE.Quaternion().setFromAxisAngle(axis,angle));
}
const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime(), w=t*Math.PI*2*1.15;
 const swing=Math.sin(w), knee=Math.max(0,Math.sin(w));
 addRot("UpperArm_L",axisX, .55*swing); addRot("UpperArm_R",axisX,-.55*swing);
 addRot("Thigh_L",axisX,-.48*swing); addRot("Thigh_R",axisX,.48*swing);
 addRot("Calf_L",axisX,-.48*Math.max(0,-swing)); addRot("Calf_R",axisX,-.48*Math.max(0,swing));
 addRot("Spine_01",axisY,.07*swing);
 if(bones.Pelvis){
   bones.Pelvis.quaternion.copy(base.Pelvis).multiply(new THREE.Quaternion().setFromAxisAngle(axisZ,.025*swing));
 }
 // visible locomotion: shuttle across ~2.4 world units while gait cycles.
 model.position.x = -1.2 + ((t*0.55)%2.4);
 model.position.y += 0; // skeleton provides gait; no cumulative bob
 controls.update(); renderer.render(scene,camera);
}
