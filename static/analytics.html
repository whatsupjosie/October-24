<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PubCast — Analytics</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0b0f; --s:#111318; --s2:#181b24; --border:rgba(255,255,255,0.06);
      --accent:#00e0ff; --green:#4ade80; --warn:#f0a500; --danger:#e05555;
      --text:#b8bdd0; --bright:#eef0f6; --muted:#4a5068; --r:6px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh}
    header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:rgba(17,19,24,0.95);position:sticky;top:0;z-index:100}
    .logo{color:var(--accent);font-size:1rem;font-weight:500;letter-spacing:0.05em}
    .back{color:var(--muted);font-size:0.72rem;text-decoration:none}
    .back:hover{color:var(--accent)}
    main{max-width:1200px;margin:0 auto;padding:2rem 1.5rem;display:flex;flex-direction:column;gap:1.5rem}
    h2{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent);margin-bottom:1rem}

    /* Stat cards */
    .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem}
    .stat-card{background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem}
    .stat-label{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:0.4rem}
    .stat-value{font-size:1.6rem;font-weight:500;color:var(--bright);line-height:1}
    .stat-sub{font-size:0.68rem;color:var(--muted);margin-top:0.3rem}
    .dot-green::before{content:'● ';color:var(--green)}
    .dot-warn::before{content:'● ';color:var(--warn)}
    .dot-red::before{content:'● ';color:var(--danger)}

    /* Storage bar */
    .storage-bar-wrap{background:var(--s2);border-radius:100px;height:6px;overflow:hidden;margin:0.4rem 0}
    .storage-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:100px;transition:width 0.6s}
    .storage-bar-fill.warn{background:linear-gradient(90deg,var(--warn),#f97316)}
    .storage-bar-fill.full{background:linear-gradient(90deg,var(--danger),#f97316)}

    /* Sessions table */
    .card{background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:1.2rem;overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:0.75rem}
    th{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);text-align:left;padding:0 0.5rem 0.6rem;border-bottom:1px solid var(--border)}
    td{padding:0.55rem 0.5rem;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,0.02)}
    .pill{display:inline-block;padding:0.15rem 0.5rem;border-radius:100px;font-size:0.62rem;font-weight:500}
    .pill-active{background:rgba(74,222,128,0.15);color:var(--green);border:1px solid rgba(74,222,128,0.25)}
    .pill-archived{background:rgba(74,85,104,0.2);color:var(--muted);border:1px solid var(--border)}
    .pill-paused{background:rgba(240,165,0,0.15);color:var(--warn);border:1px solid rgba(240,165,0,0.25)}
    .pill-error{background:rgba(224,85,85,0.15);color:var(--danger);border:1px solid rgba(224,85,85,0.25)}
    .mono{font-family:'DM Mono',monospace;font-size:0.7rem;color:var(--muted)}

    /* Mod log */
    .modlog{display:flex;flex-direction:column;gap:0.35rem;max-height:260px;overflow-y:auto}
    .modlog-row{display:flex;gap:0.8rem;font-size:0.72rem;padding:0.35rem 0;border-bottom:1px solid rgba(255,255,255,0.03)}
    .modlog-ts{color:var(--muted);flex-shrink:0;width:80px}
    .modlog-op{color:var(--accent);flex-shrink:0;width:100px;overflow:hidden;text-overflow:ellipsis}
    .modlog-action{color:var(--text)}
    .modlog-detail{color:var(--muted);font-size:0.68rem}

    /* Empty state */
    .empty{text-align:center;padding:2rem;color:var(--muted);font-size:0.78rem}

    .refresh-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.3rem 0.7rem;border-radius:var(--r);cursor:pointer;font-size:0.7rem;font-family:inherit}
    .refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
    .row-between{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    .spinning{animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <script src="/static/reach_auth.js"></script>
</head>
<body>
<header>
  <span class="logo">PubCast / Analytics</span>
  <a class="back" href="/">← Hub</a>
</header>
<main>
  <!-- Storage & quick stats -->
  <div>
    <h2>System Overview</h2>
    <div class="stat-row" id="statRow">
      <div class="stat-card"><div class="stat-label">Local Free</div><div class="stat-value" id="st-local">—</div><div class="stat-sub">GB available</div></div>
      <div class="stat-card"><div class="stat-label">Recorded</div><div class="stat-value" id="st-rec">—</div><div class="stat-sub">GB total</div></div>
      <div class="stat-card"><div class="stat-label">Sessions</div><div class="stat-value" id="st-sessions">—</div><div class="stat-sub">all time</div></div>
      <div class="stat-card"><div class="stat-label">Backup</div><div class="stat-value" id="st-backup" style="font-size:0.9rem">—</div><div class="stat-sub">status</div></div>
    </div>
    <div style="margin-top:0.8rem;background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem 1.2rem">
      <div style="display:flex;justify-content:space-between;font-size:0.7rem;margin-bottom:0.3rem">
        <span style="color:var(--muted)">Storage used</span>
        <span id="storage-pct" style="color:var(--text)">—</span>
      </div>
      <div class="storage-bar-wrap"><div class="storage-bar-fill" id="storage-bar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Recording sessions -->
  <div class="card">
    <div class="row-between">
      <h2 style="margin-bottom:0">Recording Sessions</h2>
      <button class="refresh-btn" id="refreshBtn" onclick="loadAll()">↻ Refresh</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Session ID</th><th>State</th><th>Profile</th><th>Sources</th>
          <th>Started</th><th>Duration</th><th>Markers</th>
        </tr>
      </thead>
      <tbody id="sessionsBody">
        <tr><td colspan="7" class="empty">Loading sessions…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Mod log -->
  <div class="card">
    <div class="row-between">
      <h2 style="margin-bottom:0">Moderation Log</h2>
      <select id="modRoomSelect" onchange="loadModLog()" style="background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:0.7rem;padding:0.2rem 0.5rem;border-radius:var(--r)">
        <option value="main">main</option>
        <option value="control">control</option>
        <option value="green">green</option>
      </select>
    </div>
    <div class="modlog" id="modlog"><div class="empty">Loading…</div></div>
  </div>
</main>

<script>
function fmt(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function dur(start, end) {
  if (!start) return '—';
  const s = Math.floor(((end || Date.now()/1000) - start));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sc = s%60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sc}s` : `${sc}s`;
}
function pill(state) {
  const map = {active:'pill-active',archived:'pill-archived',paused:'pill-paused',error:'pill-error',requested:'pill-archived'};
  return `<span class="pill ${map[state]||'pill-archived'}">${state}</span>`;
}

async function loadStorage() {
  try {
    const r = await fetch('/api/recording/storage');
    if (!r.ok) return;
    const s = await r.json();
    document.getElementById('st-local').textContent = s.local_free_gb ?? '—';
    document.getElementById('st-rec').textContent = s.recorded_gb ?? 0;
    document.getElementById('st-backup').textContent = s.backup_status ?? '—';
    const total = (s.local_free_gb || 0) + (s.recorded_gb || 0);
    if (total > 0) {
      const pct = Math.round((s.recorded_gb || 0) / total * 100);
      document.getElementById('storage-pct').textContent = pct + '%';
      const bar = document.getElementById('storage-bar');
      bar.style.width = pct + '%';
      bar.className = 'storage-bar-fill' + (pct > 90 ? ' full' : pct > 70 ? ' warn' : '');
    }
  } catch(e) { console.warn('analytics: storage load failed', e); }
}

async function loadSessions() {
  try {
    const r = await fetch('/api/recording/sessions');
    if (!r.ok) return;
    const sessions = await r.json();
    const list = Array.isArray(sessions) ? sessions : (sessions.sessions || []);
    document.getElementById('st-sessions').textContent = list.length;
    const tbody = document.getElementById('sessionsBody');
    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">No recording sessions yet</td></tr>';
      return;
    }
    tbody.innerHTML = list.slice(0,50).map(s => `
      <tr>
        <td class="mono">${s.session_id || '—'}</td>
        <td>${pill(s.state || 'unknown')}</td>
        <td style="color:var(--text)">${s.profile_id || '—'}</td>
        <td style="color:var(--muted)">${(s.sources||[]).join(', ') || '—'}</td>
        <td class="mono">${fmt(s.started_at)}</td>
        <td class="mono">${dur(s.started_at, s.ended_at)}</td>
        <td style="color:var(--muted)">${(s.markers||[]).length || 0}</td>
      </tr>`).join('');
  } catch(e) { console.warn('analytics: sessions load failed', e); }
}

async function loadModLog() {
  const room = document.getElementById('modRoomSelect').value || 'main';
  try {
    const r = await fetch(`/api/rooms/${room}/modlog?limit=50`);
    if (!r.ok) { document.getElementById('modlog').innerHTML = '<div class="empty">No mod log available</div>'; return; }
    const rows = await r.json();
    const list = Array.isArray(rows) ? rows : (rows.actions || rows.rows || []);
    const el = document.getElementById('modlog');
    if (!list.length) { el.innerHTML = '<div class="empty">No moderation actions logged</div>'; return; }
    el.innerHTML = list.map(r => `
      <div class="modlog-row">
        <span class="modlog-ts">${fmt(r.ts)}</span>
        <span class="modlog-op">${r.operator||'—'}</span>
        <span class="modlog-action">${r.action||'—'}</span>
        <span class="modlog-detail">${r.detail||''}</span>
      </div>`).join('');
  } catch(e) { document.getElementById('modlog').innerHTML = '<div class="empty">Mod log unavailable</div>'; }
}

async function loadAll() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  await Promise.all([loadStorage(), loadSessions(), loadModLog()]);
  btn.classList.remove('spinning');
}

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
