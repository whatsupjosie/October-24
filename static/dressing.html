<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PubCast — Dressing Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0f; --surface: #111318; --surface2: #181b24;
      --border: rgba(255,255,255,0.06); --accent: #00e0ff;
      --gold: #c9a227; --text: #b8bdd0; --bright: #eef0f6;
      --muted: #4a5068; --r: 6px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(0,224,255,0.04) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(201,162,39,0.04) 0%, transparent 50%);
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; border-bottom: 1px solid var(--border);
      background: rgba(17,19,24,0.9); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1.25rem; letter-spacing: 0.04em; }
    .back { color: var(--muted); font-size: 0.75rem; text-decoration: none; }
    .back:hover { color: var(--accent); }
    main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem; display: grid; grid-template-columns: 1fr 1.8fr; gap: 2rem; }
    @media(max-width: 700px) { main { grid-template-columns: 1fr; } }

    /* Mirror panel */
    .mirror-panel { display: flex; flex-direction: column; gap: 1.2rem; }
    .mirror {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      aspect-ratio: 3/4; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; position: relative; overflow: hidden;
    }
    .mirror::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(0,224,255,0.06), transparent 70%);
    }
    .avatar-sphere {
      width: 90px; height: 90px; border-radius: 50%;
      background: var(--accent); transition: background 0.3s, transform 0.3s;
      box-shadow: 0 0 30px var(--accent-glow, rgba(0,224,255,0.4));
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .avatar-sphere::after {
      content: ''; position: absolute; inset: -8px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1); animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);opacity:0.6} 50%{transform:scale(1.08);opacity:1} }
    .avatar-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--bright); z-index: 1; }
    .avatar-badge {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em;
      background: var(--surface2); border: 1px solid var(--border);
      padding: 0.2rem 0.6rem; border-radius: 100px; color: var(--muted); z-index: 1;
    }
    .avatar-status { font-size: 0.7rem; color: var(--accent); z-index: 1; }

    /* Wardrobe panel */
    .wardrobe-panel { display: flex; flex-direction: column; gap: 1.2rem; }
    .section-title {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--gold); margin-bottom: 0.75rem; padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(201,162,39,0.2);
    }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1.2rem; }
    label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.8rem; }
    input[type=text], input[type=file], select, textarea {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--r); color: var(--bright); font-family: 'DM Mono', monospace;
      font-size: 0.8rem; padding: 0.5rem 0.7rem; width: 100%; transition: border-color 0.15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .color-row { display: flex; gap: 0.6rem; align-items: center; }
    .color-swatch {
      width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: border-color 0.15s, transform 0.15s; flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.15); border-color: rgba(255,255,255,0.3); }
    .color-swatch.active { border-color: var(--bright); }
    .color-custom { width: 36px; height: 36px; padding: 2px; border-radius: 50%; cursor: pointer; }
    .btn {
      background: transparent; border: 1px solid var(--accent); color: var(--accent);
      border-radius: var(--r); font-family: 'DM Mono', monospace; font-size: 0.75rem;
      padding: 0.55rem 1.2rem; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .btn:hover { background: rgba(0,224,255,0.12); }
    .btn-gold { border-color: var(--gold); color: var(--gold); }
    .btn-gold:hover { background: rgba(201,162,39,0.12); }
    .btn-full { width: 100%; margin-top: 0.4rem; }
    .row { display: flex; gap: 0.6rem; }
    .saved-tag { font-size: 0.7rem; color: var(--accent); opacity: 0; transition: opacity 0.3s; margin-left: 0.5rem; }
    .saved-tag.show { opacity: 1; }

    /* Presets grid */
    .presets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; }
    .preset-item {
      aspect-ratio: 1; border-radius: var(--r); border: 2px solid transparent;
      cursor: pointer; transition: border-color 0.15s, transform 0.15s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.3rem; background: var(--surface2); font-size: 0.6rem; color: var(--muted);
      padding: 0.4rem;
    }
    .preset-item:hover { border-color: var(--border); transform: translateY(-2px); }
    .preset-item.active { border-color: var(--accent); color: var(--accent); }
    .preset-orb { width: 32px; height: 32px; border-radius: 50%; }

    /* Upload */
    .upload-zone {
      border: 1px dashed var(--border); border-radius: var(--r); padding: 1.5rem;
      text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s;
      font-size: 0.75rem; color: var(--muted);
    }
    .upload-zone:hover { border-color: var(--accent); background: rgba(0,224,255,0.03); color: var(--accent); }
    .upload-result { font-size: 0.7rem; margin-top: 0.5rem; min-height: 1em; }
    .upload-result.ok { color: var(--accent); }
    .upload-result.err { color: #e05555; }

    /* Bake status */
    .bake-status { font-size: 0.72rem; color: var(--muted); min-height: 1.2em; margin-top: 0.4rem; }
  </style>
  <script src="/static/reach_auth.js"></script>
<script src="/static/program_audio_runtime.js"></script>
</head>
<body>
<header>
  <span class="logo">PubCast</span>
  <a class="back" href="/">← Back to Hub</a>
</header>

<main>
  <!-- Mirror -->
  <div class="mirror-panel">
    <div class="card">
      <div class="section-title">Mirror</div>
      <div class="mirror">
        <div class="avatar-sphere" id="mirrorSphere">🎭</div>
        <div class="avatar-name" id="mirrorName">Loading…</div>
        <div class="avatar-badge" id="mirrorBadge"></div>
        <div class="avatar-status" id="mirrorStatus">● Ready</div>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Upload Photo → Bake Avatar</div>
      <div class="upload-zone" id="photoZone" onclick="document.getElementById('photoInput').click()">
        Drop photo here or click to select<br>
        <span style="font-size:0.65rem;color:var(--muted)">JPG, PNG, WEBP — face clearly visible</span>
      </div>
      <input type="file" id="photoInput" accept=".jpg,.jpeg,.png,.webp" style="display:none">
      <div class="bake-status" id="bakeStatus"></div>
      <button class="btn btn-gold btn-full" onclick="bakeAvatar()">✦ Bake Voxel Portrait</button>
    </div>
  </div>

  <!-- Wardrobe -->
  <div class="wardrobe-panel">
    <div class="card">
      <div class="section-title">Identity</div>
      <label>Display Name
        <input type="text" id="displayName" placeholder="Your name on stage" maxlength="40">
      </label>
      <label>Badge / Title
        <input type="text" id="badge" placeholder="Host · Guest · Producer" maxlength="30">
      </label>
      <div class="row" style="justify-content:flex-end;margin-top:0.5rem">
        <button class="btn" onclick="saveUser()">Save Identity</button>
        <span class="saved-tag" id="savedTag">✓ Saved</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Avatar Colour</div>
      <div class="color-row" id="colorSwatches">
        <div class="color-swatch" style="background:#00e0ff" data-color="#00e0ff" onclick="pickSwatch(this)" title="Cyan"></div>
        <div class="color-swatch" style="background:#7b68ee" data-color="#7b68ee" onclick="pickSwatch(this)" title="Violet"></div>
        <div class="color-swatch" style="background:#3ddad7" data-color="#3ddad7" onclick="pickSwatch(this)" title="Teal"></div>
        <div class="color-swatch" style="background:#d97706" data-color="#d97706" onclick="pickSwatch(this)" title="Amber"></div>
        <div class="color-swatch" style="background:#e05599" data-color="#e05599" onclick="pickSwatch(this)" title="Rose"></div>
        <div class="color-swatch" style="background:#4ade80" data-color="#4ade80" onclick="pickSwatch(this)" title="Green"></div>
        <div class="color-swatch" style="background:#f97316" data-color="#f97316" onclick="pickSwatch(this)" title="Orange"></div>
        <div class="color-swatch" style="background:#a78bfa" data-color="#a78bfa" onclick="pickSwatch(this)" title="Purple"></div>
        <input type="color" id="customColor" class="color-custom" value="#00e0ff" title="Custom colour" oninput="applyColor(this.value)">
      </div>
    </div>

    <div class="card">
      <div class="section-title">Avatar Presets</div>
      <div class="presets-grid" id="presetsGrid">
        <div class="preset-item" style="opacity:0.4;font-size:0.65rem;grid-column:span 4;text-align:center;padding:1rem">
          Loading presets…
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">File Uploads</div>
      <label>File
        <input type="file" id="uploadFile" accept=".png,.jpg,.jpeg,.gif,.webm,.mp4,.pdf,.txt,.md,.csv">
      </label>
      <label>Destination
        <select id="uploadTarget">
          <option value="">My Uploads</option>
          <option value="vod">Replay Library (assets/vod)</option>
        </select>
      </label>
      <button class="btn btn-full" onclick="uploadFile()">Upload File</button>
      <div class="upload-result" id="uploadResult"></div>
    </div>
  </div>
</main>

<script>
let _state = { display_name:'', avatar_color:'#00e0ff', badge:'' };

async function loadUser() {
  try {
    const r = await fetch('/api/state/user');
    if (!r.ok) return;
    const u = await r.json();
    _state = { ...u };
    document.getElementById('displayName').value = u.display_name || '';
    document.getElementById('badge').value = u.badge || '';
    applyColor(u.avatar_color || '#00e0ff');
    updateMirror();
  } catch(e) { console.warn('dressing: could not load user state', e); }
}

async function loadPresets() {
  try {
    const r = await fetch('/api/avatars/presets');
    if (!r.ok) return;
    const data = await r.json();
    const grid = document.getElementById('presetsGrid');
    const presets = data.presets || data || [];
    if (!presets.length) { grid.innerHTML = '<div style="color:var(--muted);font-size:0.7rem;text-align:center;padding:0.5rem;grid-column:span 4">No presets loaded</div>'; return; }
    grid.innerHTML = presets.map(p => `
      <div class="preset-item" data-id="${p.id||p.name}" onclick="selectPreset(this,'${p.id||p.name}')">
        <div class="preset-orb" style="background:${p.color||'#00e0ff'}"></div>
        <span>${p.name||p.id}</span>
      </div>`).join('');
  } catch(e) { console.warn('dressing: presets load failed', e); }
}

function applyColor(hex) {
  _state.avatar_color = hex;
  const sphere = document.getElementById('mirrorSphere');
  sphere.style.background = hex;
  sphere.style.setProperty('--accent-glow', hex + '66');
  document.getElementById('customColor').value = hex;
  document.querySelectorAll('.color-swatch').forEach(s => {
    s.classList.toggle('active', s.dataset.color === hex);
  });
}

function pickSwatch(el) { applyColor(el.dataset.color); }

function updateMirror() {
  document.getElementById('mirrorName').textContent = _state.display_name || 'Anonymous';
  document.getElementById('mirrorBadge').textContent = _state.badge || '';
  applyColor(_state.avatar_color || '#00e0ff');
}

async function saveUser() {
  _state.display_name = document.getElementById('displayName').value;
  _state.badge = document.getElementById('badge').value;
  try {
    await fetch('/api/state/user', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(_state)
    });
    updateMirror();
    const tag = document.getElementById('savedTag');
    tag.classList.add('show');
    setTimeout(() => tag.classList.remove('show'), 2000);
  } catch(e) { console.error('dressing: save failed', e); }
}

function selectPreset(el, presetId) {
  document.querySelectorAll('.preset-item').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  // TODO phase 2: POST preset selection to /api/avatars/me
}

async function bakeAvatar() {
  const input = document.getElementById('photoInput');
  if (!input.files[0]) {
    document.getElementById('photoZone').click();
    return;
  }
  const status = document.getElementById('bakeStatus');
  status.textContent = '⏳ Baking voxel portrait…';
  const fd = new FormData();
  fd.append('file', input.files[0]);
  fd.append('mode', 'TRACK');
  try {
    const r = await fetch('/api/avatars/me/bake', { method: 'POST', body: fd });
    const d = await r.json();
    if (r.ok) {
      status.textContent = `✓ Portrait baked — skin: ${d.skin_voxel || 'auto'}, face detected: ${d.face_detected ? 'yes' : 'no'}`;
      status.style.color = 'var(--accent)';
    } else {
      status.textContent = `✗ ${d.error || 'Bake failed'}`;
      status.style.color = '#e05555';
    }
  } catch(e) {
    status.textContent = '✗ Bake request failed';
    status.style.color = '#e05555';
  }
}

document.getElementById('photoInput').addEventListener('change', e => {
  if (e.target.files[0]) {
    document.getElementById('photoZone').textContent = `📸 ${e.target.files[0].name}`;
    document.getElementById('photoZone').style.borderColor = 'var(--accent)';
  }
});

async function uploadFile() {
  const file = document.getElementById('uploadFile').files[0];
  const target = document.getElementById('uploadTarget').value;
  const resultEl = document.getElementById('uploadResult');
  if (!file) { resultEl.textContent = 'Select a file first'; resultEl.className = 'upload-result err'; return; }
  const fd = new FormData();
  fd.append('file', file);
  if (target) fd.append('target', target);
  resultEl.textContent = 'Uploading…'; resultEl.className = 'upload-result';
  try {
    const r = await fetch('/api/upload', { method: 'POST', body: fd });
    const d = await r.json();
    if (r.ok) { resultEl.textContent = `✓ ${(d.path||'').split('/').pop() || 'uploaded'}`; resultEl.className = 'upload-result ok'; }
    else { resultEl.textContent = `✗ ${d.error || 'failed'}`; resultEl.className = 'upload-result err'; }
  } catch(e) { resultEl.textContent = '✗ Upload failed'; resultEl.className = 'upload-result err'; }
}

// Live mirror updates
document.getElementById('displayName').addEventListener('input', e => {
  _state.display_name = e.target.value;
  document.getElementById('mirrorName').textContent = e.target.value || 'Anonymous';
});
document.getElementById('badge').addEventListener('input', e => {
  _state.badge = e.target.value;
  document.getElementById('mirrorBadge').textContent = e.target.value;
});

loadUser();
loadPresets();
</script>
</body>
</html>
