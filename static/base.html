<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PubCast AI{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/console.css" />
    {% block head %}{% endblock %}
  </head>
  <body>
    {% block body %}{% endblock %}

    <!-- Persistent bottom bar -->
    <div id="pub-basebar" style="
      position:fixed;left:0;right:0;bottom:0;height:48px;
      background:rgba(10,12,18,0.97);
      border-top:1px solid rgba(255,255,255,0.06);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 14px;z-index:900;
    "></div>

    <!-- Scripts: order matters -->
    <script src="/static/reach_auth.js"></script>
    <script src="/static/ws.js"></script>
    <script src="/static/console.js"></script>
    <script src="/static/basebar.js"></script>
    <script src="/static/ui.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
