<!doctype html><html><head><meta charset="utf-8"><title>PubCast saved files</title><style>body{background:#1c1510;color:#f0dfc1;font:16px system-ui;padding:16px}button{padding:8px;margin:4px;background:#3b3022;color:inherit;border:1px solid #8c7651}li{margin:10px 0}small{opacity:.8}</style></head><body><h2>Saved working files</h2><p>Originals and working copies stored by this browser. Export copies to keep them outside PubCast.</p><button id="refresh">Refresh</button><ul id="files"></ul><h3>Local PubCast folders</h3><ul id="disk-files"></ul><p role="status" id="status"></p><script src="/static/foresight_files.js"></script><script>
'use strict';
async function refresh(){try{const files=(await ForesightFiles.list()).filter(f=>f.id!=='twoi-native-last');const list=document.getElementById('files');list.replaceChildren();for(const f of files.sort((a,b)=>b.updated-a.updated)){const li=document.createElement('li'),button=document.createElement('button');button.textContent=f.name;button.onclick=()=>{if(parent===window)location.assign('/writers-room?file='+encodeURIComponent(f.id));else parent.postMessage({type:'foresight:open-file',fileId:f.id,name:f.name},location.origin)};li.append(button,document.createTextNode(' · '+new Date(f.updated).toLocaleString()+' · '+f.size+' bytes'));list.append(li)}document.getElementById('status').textContent=files.length+' saved working copies';
const disk=await ForesightFiles.workspace('files');const dl=document.getElementById('disk-files');dl.replaceChildren();
for(const f of disk.files){const li=document.createElement('li'),b=document.createElement('button');b.textContent=f.path;b.onclick=async()=>{try{const saved=await ForesightFiles.workspace('file?path='+encodeURIComponent(f.path));const bytes=Uint8Array.from(atob(saved.data),c=>c.charCodeAt(0)),id=crypto.randomUUID(),name=f.path.split('/').pop();await ForesightFiles.record(id,{id,name,mime:'',original:new File([bytes],name),workspace:{path:f.path,revision:saved.revision,format:name.endsWith('.2i')?'2i':undefined},updated:Date.now()});if(parent===window)location.assign('/writers-room?file='+id);else parent.postMessage({type:'foresight:open-file',fileId:id,name},location.origin)}catch(e){document.getElementById('status').textContent=e.message}};li.append(b);dl.append(li)}}catch(e){document.getElementById('status').textContent=e.message}}
document.getElementById('refresh').onclick=refresh;refresh();
</script></body></html>
