<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>PubCast — The Pub</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0c0a08;--s:#141210;--s2:#1c1916;--border:rgba(255,200,100,0.08);--accent:#c9a227;--warm:#e8c97a;--ember:#d97706;--text:#c8baa8;--bright:#f0e8d8;--muted:#5a5040;--r:6px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;
      background-image:radial-gradient(ellipse at 20% 80%,rgba(201,162,39,0.05),transparent 50%),
                       radial-gradient(ellipse at 80% 20%,rgba(217,119,6,0.04),transparent 50%)}
    header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:rgba(20,18,16,0.95);position:sticky;top:0;z-index:100}
    .logo{font-family:'Spectral',serif;color:var(--accent);font-size:1.1rem;font-style:italic;letter-spacing:0.03em}
    .back{color:var(--muted);font-size:0.72rem;text-decoration:none}
    .back:hover{color:var(--accent)}
    main{max-width:1100px;margin:0 auto;padding:2rem 1.5rem;display:grid;grid-template-columns:1fr 320px;gap:1.5rem}
    @media(max-width:750px){main{grid-template-columns:1fr}}

    /* Tavern board */
    .board-section h2{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--ember);margin-bottom:1rem}
    .board{background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;min-height:400px;display:flex;flex-direction:column;gap:0}

    /* Message feed */
    .feed{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:0.5rem;min-height:300px;max-height:calc(100vh - 350px);padding-right:0.2rem}
    .msg{display:flex;gap:0.7rem;padding:0.5rem;border-radius:var(--r);transition:background 0.1s}
    .msg:hover{background:rgba(255,255,255,0.02)}
    .msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:600}
    .msg-body{flex:1;min-width:0}
    .msg-header{display:flex;gap:0.6rem;align-items:baseline;margin-bottom:0.2rem}
    .msg-name{font-size:0.75rem;color:var(--bright);font-weight:500}
    .msg-time{font-size:0.62rem;color:var(--muted)}
    .msg-text{font-size:0.8rem;color:var(--text);line-height:1.5;word-break:break-word}
    .msg.self .msg-name{color:var(--accent)}
    .msg.agent .msg-name{color:var(--warm)}
    .msg.system{opacity:0.5;font-size:0.7rem;text-align:center;justify-content:center;padding:0.25rem}

    /* Chat input */
    .chat-compose{display:flex;gap:0.6rem;padding-top:1rem;border-top:1px solid var(--border);margin-top:0.5rem}
    .chat-input{flex:1;background:var(--s2);border:1px solid var(--border);color:var(--bright);font-family:inherit;font-size:0.8rem;padding:0.55rem 0.8rem;border-radius:var(--r);resize:none;height:42px}
    .chat-input:focus{outline:none;border-color:var(--accent)}
    .send-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:0 1rem;border-radius:var(--r);cursor:pointer;font-family:inherit;font-size:0.75rem;transition:background 0.15s;white-space:nowrap}
    .send-btn:hover{background:rgba(201,162,39,0.1)}

    /* Sidebar */
    .sidebar{display:flex;flex-direction:column;gap:1.2rem}
    .card{background:var(--s);border:1px solid var(--border);border-radius:var(--r);padding:1rem}
    .card h3{font-size:0.6rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:0.8rem}

    /* Regulars list */
    .regulars{display:flex;flex-direction:column;gap:0.4rem}
    .regular-row{display:flex;align-items:center;gap:0.6rem;padding:0.3rem 0}
    .reg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .reg-dot.online{background:var(--warm)}
    .reg-dot.offline{background:var(--muted)}
    .reg-name{font-size:0.75rem;color:var(--text)}
    .reg-badge{font-size:0.6rem;color:var(--muted)}
    .online-count{font-size:0.65rem;color:var(--warm);margin-bottom:0.6rem}

    /* Topics / pinned */
    .topic-item{font-size:0.72rem;padding:0.5rem 0;border-bottom:1px solid var(--border);color:var(--text)}
    .topic-item:last-child{border-bottom:none}
    .topic-label{font-size:0.6rem;color:var(--ember);text-transform:uppercase;letter-spacing:0.08em}
    .ws-status{font-size:0.65rem;color:var(--muted);margin-top:0.4rem}
    .ws-status.connected{color:var(--warm)}
  </style>
  <script src="/static/reach_auth.js"></script>
</head>
<body>
<header>
  <span class="logo">The Pub</span>
  <a class="back" href="/">← Hub</a>
</header>
<main>
  <!-- Board -->
  <div class="board-section">
    <h2>Taproom Chat</h2>
    <div class="board">
      <div class="feed" id="feed"></div>
      <div class="chat-compose">
        <input class="chat-input" id="chatInput" placeholder="Say something…" maxlength="500" autocomplete="off">
        <button class="send-btn" onclick="sendMsg()">Send</button>
      </div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="card">
      <h3>Who's Here</h3>
      <div class="online-count" id="onlineCount">0 at the bar</div>
      <div class="regulars" id="regularsList">
        <div style="font-size:0.7rem;color:var(--muted)">Waiting for regulars…</div>
      </div>
      <div class="ws-status" id="wsStatus">⬤ Connecting…</div>
    </div>

    <div class="card">
      <h3>Tonight's Topics</h3>
      <div id="topicsList">
        <div class="topic-item"><div class="topic-label">Pinned</div>Welcome to the Pub — no agenda, just good conversation.</div>
        <div class="topic-item"><div class="topic-label">Discussion</div>What are you building with PubCast this week?</div>
        <div class="topic-item"><div class="topic-label">Feature Talk</div>Avatar Foundry — reactions and thoughts?</div>
      </div>
    </div>
  </div>
</main>

<script>
let _myName = 'You';
let _myColor = '#c9a227';
let _ws = null;
let _retries = 0;

async function loadUser() {
  try {
    const r = await fetch('/api/state/user');
    if (r.ok) {
      const u = await r.json();
      _myName = u.display_name || 'Guest';
      _myColor = u.avatar_color || '#c9a227';
    }
  } catch(e) {}
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  _ws = new WebSocket(window.ReachAuth.websocketURL('/ws/pub'));

  _ws.onopen = () => {
    _retries = 0;
    document.getElementById('wsStatus').textContent = '⬤ Connected to taproom';
    document.getElementById('wsStatus').className = 'ws-status connected';
    _ws.send(JSON.stringify({ type: 'join', uid: 'bar_' + Math.random().toString(36).slice(2,8), username: _myName, token: '' }));
    postSystem('You pulled up a stool. Welcome.');
  };

  _ws.onmessage = e => {
    try { handleEvent(JSON.parse(e.data)); } catch(_) {}
  };

  _ws.onclose = () => {
    document.getElementById('wsStatus').textContent = '⬤ Disconnected — reconnecting…';
    document.getElementById('wsStatus').className = 'ws-status';
    const delay = Math.min(500 * 2 ** _retries++, 12000);
    setTimeout(connect, delay);
  };

  _ws.onerror = () => _ws.close();
}

function handleEvent(ev) {
  if (ev.type === 'history' && ev.payload) {
    ev.payload.forEach(m => { if (m.text) postMsg(m.user || 'Unknown', m.text, m.user === _myName ? 'self' : ''); });
    return;
  }
  if (ev.type === 'chat' && ev.payload) {
    const p = ev.payload;
    if (p.user !== _myName) postMsg(p.user || 'Unknown', p.text || '');
    return;
  }
  if (ev.type === 'presence') {
    const parts = ev.payload?.participants || [];
    const count = ev.payload?.count || parts.length;
    document.getElementById('onlineCount').textContent = `${count} at the bar`;
    renderRegulars(parts);
    return;
  }
}

function postMsg(name, text, cls) {
  const feed = document.getElementById('feed');
  const div = document.createElement('div');
  div.className = 'msg' + (cls ? ' ' + cls : '');
  const initial = (name[0] || '?').toUpperCase();
  const color = cls === 'self' ? _myColor : hashColor(name);
  div.innerHTML = `
    <div class="msg-avatar" style="background:${color}22;color:${color}">${initial}</div>
    <div class="msg-body">
      <div class="msg-header">
        <span class="msg-name">${esc(name)}</span>
        <span class="msg-time">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
      </div>
      <div class="msg-text">${esc(text)}</div>
    </div>`;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function postSystem(text) {
  const feed = document.getElementById('feed');
  const div = document.createElement('div');
  div.className = 'msg system';
  div.textContent = text;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (_ws && _ws.readyState === WebSocket.OPEN) {
    _ws.send(JSON.stringify({ type: 'chat', text, user: _myName, t: Date.now()/1000 }));
    postMsg(_myName, text, 'self');
    input.value = '';
  } else {
    postSystem('Not connected — try refreshing');
  }
}

function renderRegulars(parts) {
  const el = document.getElementById('regularsList');
  if (!parts.length) { el.innerHTML = '<div style="font-size:0.7rem;color:var(--muted)">Empty bar right now…</div>'; return; }
  el.innerHTML = parts.slice(0,12).map(p => `
    <div class="regular-row">
      <div class="reg-dot online"></div>
      <span class="reg-name">${esc(p.username || p.uid || 'Guest')}</span>
      <span class="reg-badge">${esc(p.role || '')}</span>
    </div>`).join('');
}

function hashColor(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  const colors = ['#c9a227','#3ddad7','#7b68ee','#4ade80','#f97316','#e05599','#a78bfa','#00e0ff'];
  return colors[Math.abs(h) % colors.length];
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

loadUser().then(connect);
</script>
</body>
</html>
