<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foresight — The Counter</title>
<style>
:root{
  --bg:#090b0c; --panel:#14181a; --panel2:#0e1112;
  --line:#8e6336; --line2:#c28a4c; --gold:#d9a35b; --cream:#efe0c6;
  --text:#eadcc7; --muted:#918678; --green:#75a968; --red:#a96557;
  --shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.035);
  --silver:#c9ccd1; --silver-dim:#8d9198;
  --fan-top:62px; --counter-top:124px;
  /* One light source for the whole Counter: every shape shadow reads these. */
  --light-x:-6px; --light-y:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:
  radial-gradient(ellipse at 50% 0%,rgba(177,119,57,.14),transparent 38%),
  radial-gradient(ellipse at 10% 70%,rgba(94,61,36,.10),transparent 36%),
  #060809;
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}

/* ---- top bar ---- */
.topbar{height:52px;display:flex;align-items:center;gap:16px;padding:0 18px;
  border-bottom:1px solid #3d2c1c;background:linear-gradient(180deg,#14181a,#0b0d0e)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;
  letter-spacing:.1em;font-size:15px;color:#ecd8b8}
.topbar .brand .mark{width:18px;height:24px;border:1px solid var(--gold);border-radius:50% 50% 40% 40%;
  display:grid;place-items:center;color:var(--gold);font-size:10px;box-shadow:0 0 14px #b7793744}
.topbar .status{margin-left:auto;display:flex;gap:14px;font-size:11px;color:var(--muted)}
.topbar .status b{color:var(--gold)}
.dotstat{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
.dotstat.up{background:var(--green);box-shadow:0 0 6px var(--green)}
.dotstat.down{background:var(--red);box-shadow:0 0 6px var(--red)}
.dotstat.checking{background:#7a6a4c}

/* ---- upper-left control anchor ---- */
.anchor{position:fixed;left:16px;top:var(--fan-top);z-index:500;display:flex;flex-direction:row;align-items:flex-start;gap:10px;
  right:16px;pointer-events:none}
.anchor > *{pointer-events:auto}
.lantern{width:44px;height:56px;border:1px solid var(--line2);border-radius:50% 50% 42% 42%;
  background:radial-gradient(circle at 50% 40%,#4d321e,#161313 68%);
  display:grid;place-items:center;color:var(--gold);cursor:pointer;
  box-shadow:0 0 24px rgba(216,153,68,.28), inset 0 0 14px rgba(216,153,68,.18);
  transition:box-shadow .25s}
.lantern:hover{box-shadow:0 0 34px rgba(216,153,68,.42), inset 0 0 16px rgba(216,153,68,.24)}
.lantern .spark{font-size:15px;filter:drop-shadow(0 0 4px #f3cf8f)}
/* The fan extends rightward from the lantern along the top axis. One blade per
   open tray, then the single blank blade. Overflow scrolls sideways. */
.arm{width:22px;height:4px;margin-top:26px;border-radius:3px;background:linear-gradient(90deg,#7a5530,#c28a4c);
  box-shadow:0 0 8px #b7793744}
.blades{display:flex;flex-direction:row;align-items:flex-start;gap:6px;overflow-x:auto;overflow-y:hidden;
  padding:12px 4px 6px;max-width:calc(100vw - 120px);scrollbar-width:thin;transition:opacity .2s, transform .2s;
  transform-origin:left center}
.blades.retracted{opacity:0;transform:scaleX(.08);pointer-events:none}
.blade{flex:0 0 auto;max-width:210px;min-height:34px;border:1px solid #6d4b2d;border-radius:14px 14px 6px 6px;
  background:linear-gradient(180deg,#1c1712,#121617);text-align:left;padding:7px 10px;
  color:#cbb99f;font-size:11px;cursor:pointer;transition:transform .15s,border-color .15s;display:flex;align-items:center;gap:7px;
  transform:skewX(-6deg);filter:drop-shadow(var(--light-x) var(--light-y) 6px rgba(0,0,0,.55))}
.blade .b-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.blade:hover{border-color:#c48b4e;transform:translateY(2px) skewX(-6deg)}
.blade.active{border-color:var(--gold);color:var(--cream)}
.blade.stowed{opacity:.68}
.blade .b-ico{opacity:.75}
.blade.blank{color:var(--gold);justify-content:center;min-width:44px;font-size:15px;border-style:dashed}
.blade .b-close{margin-left:2px;opacity:.5;font-size:11px;padding:1px 4px}
.blade .b-close:hover{opacity:1;color:#e08a6f}
/* closed blade: unlatch, then fall away like a played card with sway */
.blade-falling{position:fixed;z-index:990;pointer-events:none;animation:cardfall 1.2s cubic-bezier(.45,.05,.85,.35) forwards}
@keyframes cardfall{
  0%{transform:skewX(-6deg) translateY(0) rotate(0)}
  8%{transform:skewX(-6deg) translateY(6px) rotate(-3deg)}
  30%{transform:translate(-26px,24vh) rotate(14deg)}
  55%{transform:translate(22px,52vh) rotate(-10deg)}
  80%{transform:translate(-14px,82vh) rotate(18deg)}
  100%{transform:translate(8px,118vh) rotate(-6deg);opacity:.85}}
/* glow-to-locate a tray from its blade */
.tray.locate{animation:locate 1.4s ease-out}
@keyframes locate{0%,100%{box-shadow:var(--shadow)}25%,65%{box-shadow:0 0 0 2px var(--gold),0 0 34px 6px rgba(217,163,91,.55),var(--shadow)}}

/* ---- counter workspace ---- */
.counter{position:absolute;left:0;right:0;top:var(--counter-top);bottom:0;overflow:hidden}
.counter-surface{position:relative;width:100%;height:100%}
.counter-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#4a4136;font-size:13px;letter-spacing:.08em;pointer-events:none;text-align:center;padding:40px}

/* ---- trays ---- */
.tray{position:absolute;background:linear-gradient(145deg,rgba(24,29,30,.97),rgba(11,14,15,.97));
  border:1px solid #5d4229;border-radius:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;min-width:280px;min-height:180px}
.tray.dragging,.tray.resizing{opacity:.92;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.tray.focused{border-color:var(--gold)}
.tray-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:grab;
  background:linear-gradient(180deg,#1d2223,#14181a);border-bottom:1px solid #3d2c1c;user-select:none}
.tray-head:active{cursor:grabbing}
.tray-head .t-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#cbb99f;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray-head .t-dot{width:6px;height:6px;border-radius:50%}
.tray-head button{background:none;border:1px solid #4b3a2b;border-radius:6px;color:#b3a68f;
  width:22px;height:22px;cursor:pointer;font-size:11px;line-height:1;display:grid;place-items:center}
.tray-head button:hover{border-color:var(--gold);color:var(--gold)}
.tray-body{flex:1;position:relative;background:#08090a;min-height:0}
.tray-body iframe{width:100%;height:100%;border:0;background:#0b0d0e}
.resize-grip{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;
  border-right:2px solid #6d4b2d;border-bottom:2px solid #6d4b2d;border-radius:0 0 6px 0;opacity:.6}
.resize-grip:hover{opacity:1;border-color:var(--gold)}
.tray.falling{transition:transform .55s cubic-bezier(.55,-0.1,.9,.35), opacity .55s linear;
  transform:translateY(140vh) rotate(14deg);opacity:0}

body.portal-entered .counter{position:fixed;inset:0;z-index:800}
.tray.entered{position:absolute!important;inset:0!important;width:auto!important;height:auto!important;
  min-width:0;min-height:0;border-radius:0;z-index:850!important;box-shadow:none}
.tray.entered .tray-head{cursor:default}
.tray.entered .resize-grip{display:none}
.tray .t-enter.active{border-color:var(--gold);color:var(--gold)}
.tray[data-portal-kind=chat] .tray-head{border-bottom-color:#51422f}
.tray[data-persistent=true] .t-close{color:#d7c9ae}
.pitem .where{display:block;margin-top:4px;color:#665d52;font-size:9px;letter-spacing:.05em}

/* status widget (for PubPartner / 2i, which have no page of their own — real live data, no page chrome) */
.statuswrap{padding:16px;height:100%;overflow:auto}
.statuswrap h3{margin:0 0 4px;font:500 15px Georgia,serif;color:#e3cfa9}
.statuswrap .sub{color:var(--muted);font-size:11px;margin-bottom:14px}
.srow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #241f19;font-size:12px}
.srow span:last-child{color:#c9b79c}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;letter-spacing:.05em}
.pill.ok{background:#1c2b19;color:#8fbd80;border:1px solid #375a2e}
.pill.bad{background:#2b1c19;color:#d19080;border:1px solid #5a3129}
.pill.wait{background:#241f19;color:#c9b79c;border:1px solid #4b3a2b}
.serr{color:#c78267;font-size:11px;margin-top:10px}

/* ---- picker modal ---- */
.modal-veil{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:900}
.modal-veil.open{display:flex}
.modal{width:560px;max-width:92vw;max-height:80vh;overflow:auto;background:linear-gradient(145deg,#181d1e,#0c0f10);
  border:1px solid #6d4b2d;border-radius:18px;box-shadow:var(--shadow);padding:20px}
.modal h2{margin:0 0 3px;font:500 17px Georgia,serif;color:#ecd8b8}
.modal .sub{color:var(--muted);font-size:11px;margin-bottom:16px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.psection{grid-column:1/-1;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--silver-dim);margin-top:6px}
.pitem{border:1px solid #4b3a2b;border-radius:12px;padding:12px;background:#111516;cursor:pointer;text-align:left}
.pitem:hover{border-color:var(--gold);background:#151a1b}
.pitem b{display:block;font-size:12px;color:#e3cfa9;margin-bottom:3px}
.pitem span{font-size:10px;color:var(--muted)}
.modal-close{margin-top:16px;border:1px solid #4b3a2b;background:#111516;color:#b3a68f;border-radius:10px;
  padding:8px 14px;cursor:pointer;font-size:11px}

.toast{position:fixed;right:24px;bottom:24px;background:#161b1c;border:1px solid #876038;border-radius:12px;
  padding:11px 14px;color:#d6c5aa;font-size:11px;box-shadow:0 10px 35px #0008;opacity:0;
  transform:translateY(8px);pointer-events:none;transition:.2s;z-index:950}
.toast.show{opacity:1;transform:none}

/* ---- menu bar ---- */
.menubar{display:flex;align-items:center;gap:2px;margin-left:18px;height:100%}
.menu{position:relative;height:100%;display:flex;align-items:center}
.menu-btn{background:none;border:0;color:var(--silver);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 10px;border-radius:7px;cursor:pointer}
.menu-btn:hover,.menu.open .menu-btn,.menu-btn:focus-visible{color:var(--cream);background:#1f1a14;outline:none}
.menu-list{position:absolute;top:44px;left:0;min-width:240px;display:none;flex-direction:column;padding:6px;
  background:linear-gradient(160deg,#1a1f20,#0d1011);border:1px solid #6d4b2d;border-radius:12px;
  box-shadow:var(--shadow);z-index:960}
.menu.open .menu-list{display:flex}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;
  padding:7px 10px;text-align:left;color:#d8c8ad;font-size:12px;cursor:pointer}
.menu-item:hover:not([disabled]),.menu-item:focus-visible{background:#2a2219;color:var(--cream);outline:none}
.menu-item[disabled]{color:#5f574d;cursor:default}
.menu-item .mi-key{margin-left:auto;color:#7d7264;font-size:10px;letter-spacing:.05em}
.menu-sep{height:1px;background:#3a2c1f;margin:5px 4px}
.menu-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#7d7264;padding:6px 10px 3px}

/* ---- ask / info modal ---- */
.ask-input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #6d4b2d;background:#0b0e0f;color:var(--cream);font-size:13px}
.ask-input:focus{outline:none;border-color:var(--gold)}
.ask-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.ask-actions button{border:1px solid #4b3a2b;background:#111516;color:#d8c8ad;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:11px}
.ask-actions button.primary{border-color:var(--gold);color:var(--cream);background:#2a2219}
.ask-error{color:#d19080;font-size:11px;min-height:15px;margin-top:6px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;color:#d8c8ad}
.keys kbd{font:11px ui-monospace,monospace;border:1px solid #4b3a2b;border-radius:5px;padding:1px 6px;color:var(--gold);white-space:nowrap}

/* ---- browser / video / external program trays ---- */
.webbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #2b2219;background:#101415}
.webbar input{flex:1;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid #3d2c1c;background:#090b0c;color:var(--cream);font-size:12px}
.webbar input:focus{outline:none;border-color:var(--gold)}
.webbar button{border:1px solid #4b3a2b;background:#14181a;color:#cbb99f;border-radius:7px;height:28px;min-width:28px;padding:0 8px;cursor:pointer;font-size:12px}
.webbar button:hover{border-color:var(--gold);color:var(--gold)}
.tray-body.web{display:flex;flex-direction:column}
.tray-body.web iframe{flex:1;height:auto}
.webnote{font-size:10px;color:#7d7264;padding:4px 10px;border-top:1px solid #1d1914;background:#0c0f10}
.tray-body.video{display:flex;flex-direction:column;background:#000}
.tray-body.video video{flex:1;width:100%;min-height:0;background:#000}
.panel-msg{padding:22px;height:100%;overflow:auto;color:#d8c8ad;font-size:12px;line-height:1.6}
.panel-msg h3{margin:0 0 6px;font:500 15px Georgia,serif;color:#e3cfa9}
.panel-msg code{font:11px ui-monospace,monospace;color:var(--gold);background:#0b0e0f;border:1px solid #2b2219;border-radius:6px;padding:2px 6px}
.panel-msg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.panel-msg .acts button{border:1px solid #4b3a2b;background:#111516;color:#d8c8ad;border-radius:9px;padding:7px 12px;cursor:pointer;font-size:11px}
.panel-msg .acts button:hover{border-color:var(--gold);color:var(--cream)}
.reclist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.recitem{display:flex;justify-content:space-between;gap:10px;border:1px solid #3a2c1f;border-radius:9px;padding:8px 10px;background:#101415;cursor:pointer;text-align:left;color:#d8c8ad;font-size:12px}
.recitem:hover{border-color:var(--gold)}
.recitem span:last-child{color:#7d7264;font-size:10px;white-space:nowrap}

/* ====================================================================
   MATTER SKIN — frames, blades, lantern, bar and bench are rendered in C++
   (foresight_matter.wasm). These rules only place those pictures and set
   the type that sits on them. If the renderer is unavailable the plain
   look above remains.
   ==================================================================== */
#bench{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;opacity:0;transition:opacity .6s;pointer-events:none}
#bench.ready{opacity:1}
html,body{background:#2c1a10}
.topbar,.counter,.anchor{position:relative;z-index:1}
.anchor{position:fixed;z-index:500}
.counter{position:absolute}

/* system bar: brushed silver */
.topbar.matter{background:none;border-bottom:0;position:relative}
.topbar .bar-art{position:absolute;z-index:-1;pointer-events:none}
.topbar.matter .brand{color:#2b2622;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.topbar.matter .brand .mark{border-color:#6c5530;color:#6c5530;box-shadow:none}
.topbar.matter .menu-btn{color:#2e2a26;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.topbar.matter .menu-btn:hover,.topbar.matter .menu.open .menu-btn,.topbar.matter .menu-btn:focus-visible{background:rgba(40,30,20,.12);color:#120e0a}
.topbar.matter .status{color:#3a342e}
.topbar.matter .status b{color:#5c4520}

/* lantern: brass and amber, a warm light that breathes */
.lantern.matter{width:60px;height:76px;border:0;border-radius:0;background:none;box-shadow:none;position:relative;z-index:3;
  filter:drop-shadow(0 0 14px rgba(255,170,70,.45))}
.lantern .l-art{position:absolute;left:-16px;top:-16px;pointer-events:none}
.lantern.matter .spark{position:relative;z-index:1;font-size:18px;color:#fff1c8;
  filter:drop-shadow(0 0 6px #ffb347) drop-shadow(0 0 14px #ff9a2e);animation:lanternBreath 3.2s ease-in-out infinite}
@keyframes lanternBreath{0%,100%{opacity:.82;transform:scale(1)}45%{opacity:1;transform:scale(1.08)}70%{opacity:.9;transform:scale(1.02)}}
.lantern.matter:hover{filter:drop-shadow(0 0 22px rgba(255,170,70,.7))}

/* the fan: a deck of cards fanned around the lantern */
.anchor .arm{display:none}
.blades.radial{position:absolute;left:52px;top:38px;width:0;height:0;overflow:visible;padding:0;max-width:none;display:block;transform:none!important;opacity:1!important}
.blades.radial .blade{position:absolute;left:0;top:-29px;width:236px;height:58px;max-width:none;min-height:0;padding:9px 16px 0 92px;align-items:flex-start!important;
  border:0;border-radius:0;background:none;transform-origin:0 50%;
  transform:rotate(var(--ang)) translateX(var(--push,0px));
  transition:transform .55s cubic-bezier(.2,.8,.25,1.15), opacity .35s; transition-delay:var(--delay,0s);
  filter:none;display:flex;align-items:center;gap:6px;color:#2a241e;font-size:11px;letter-spacing:.04em}
.blades.radial .blade .b-art{position:absolute;pointer-events:none;z-index:-1}
.blades.radial .blade[data-ink=light]{color:#f4e6c8;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.blades.radial .blade[data-ink=dark]{color:#2a241e;text-shadow:0 1px 0 rgba(255,255,255,.45)}
.blades.radial .blade .b-label{max-width:150px;font-weight:600}
.blades.radial .blade:hover{--push:10px}
.blades.radial .blade.active .b-label{text-decoration:underline;text-decoration-color:rgba(214,169,87,.9);text-underline-offset:3px}
.blades.radial .blade.stowed{opacity:.72}
.blades.radial .blade.blank{justify-content:flex-start;font-size:20px;color:#6b5126}
.blades.radial .blade .b-close{margin-left:auto}
.blades.radial.retracted .blade{transform:rotate(4deg) translateX(-30px) scaleX(.18);opacity:0;pointer-events:none}
.blade-falling.radial-ghost{position:fixed;width:236px;height:58px;transform-origin:0 50%;margin-top:-29px;padding:0 18px 0 46px;
  display:flex;align-items:center;border:0;background:none;filter:none;animation:cardfallRadial 1.25s cubic-bezier(.45,.05,.85,.35) forwards}
.blade-falling.radial-ghost .b-art{position:absolute;z-index:-1}
@keyframes cardfallRadial{
  0%{transform:rotate(var(--ang))}
  10%{transform:translate(4px,8px) rotate(calc(var(--ang) + 6deg))}
  32%{transform:translate(-30px,26vh) rotate(calc(var(--ang) + 28deg))}
  58%{transform:translate(26px,54vh) rotate(calc(var(--ang) - 6deg))}
  82%{transform:translate(-16px,84vh) rotate(calc(var(--ang) + 34deg))}
  100%{transform:translate(10px,120vh) rotate(calc(var(--ang) + 12deg));opacity:.85}}

/* trays: the element is the safe content rectangle; the frame is drawn around it */
.tray.matter{background:none;border:0;border-radius:6px;box-shadow:none;overflow:visible}
.tray > .t-frame{position:absolute;z-index:-1;pointer-events:none;transition:filter .25s}
.tray.matter.focused > .t-frame{filter:brightness(1.06) saturate(1.05)}
.tray.matter.dragging > .t-frame{filter:brightness(1.08) drop-shadow(0 18px 22px rgba(0,0,0,.45))}
.tray.matter > .tray-head{border-radius:6px 6px 0 0;border-bottom:1px solid rgba(0,0,0,.25)}
.tray.matter[data-ink=dark] > .tray-head{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.12))}
.tray.matter[data-ink=dark] > .tray-head .t-title{color:#2e2720}
.tray.matter[data-ink=dark] > .tray-head button{border-color:rgba(70,52,30,.45);color:#4a3a26}
.tray.matter[data-ink=light] > .tray-head{background:linear-gradient(180deg,rgba(0,0,0,.30),rgba(0,0,0,.10))}
.tray.matter[data-ink=light] > .tray-head .t-title{color:#f1dfb9}
.tray.matter[data-ink=light] > .tray-head button{border-color:rgba(230,200,140,.45);color:#ead6ae}
.tray.matter > .tray-head button:hover{border-color:#d6a957;color:#d6a957}
.tray.matter > .tray-body{border-radius:0 0 6px 6px;background:#0b0d0e;box-shadow:inset 0 2px 10px rgba(0,0,0,.55)}
.tray.matter[data-ink=dark] > .tray-body{background:#f7f4ee;color:#2a241e}
.tray.matter[data-ink=dark] > .tray-body .statuswrap h3,.tray.matter[data-ink=dark] > .tray-body .panel-msg h3{color:#3b2c18}
.tray.matter[data-ink=dark] > .tray-body .panel-msg,.tray.matter[data-ink=dark] > .tray-body .srow span:last-child{color:#3a3128}

<script src="/static/foresight_matter.js"></script>
